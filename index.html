<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Zeet Apps – Privacy and Support</title>
<meta name="description" content="Privacy policies and support pages for apps by Zeet Apps.">
<style>
  :root { --page:#F4EDE2; --card:#FBF7F0; --ink:#2B2520; --muted:#625950; --heading:#1B3F3B; --accent:#1F5A55; --line:#DCD1C0; }
  @media (prefers-color-scheme: dark) {
    :root { --page:#132120; --card:#1C2C2A; --ink:#ECE4D6; --muted:#B8AE9F; --heading:#F1E6D0; --accent:#7FC4B7; --line:#334542; }
  }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--page); color:var(--ink); font:17px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  main { max-width:760px; margin:0 auto; padding:40px 16px 64px; }
  h1 { font-family: Lora, Georgia, serif; color:var(--heading); font-weight:600; font-size:34px; margin:0 0 8px; }
  p { color:var(--muted); }
  a.app { display:block; background:var(--card); border:1px solid var(--line); border-radius:20px; padding:16px 20px; margin-top:16px; text-decoration:none; color:var(--ink); }
  a.app strong { color:var(--accent); font-size:19px; }
</style>
</head>
<body>
<main>
  <h1>Zeet Apps</h1>
  <p>Privacy policies and support for our apps. Contact: <a href="mailto:zeetforfun@gmail.com">zeetforfun@gmail.com</a></p>
  <a class="app" href="carnatic-vocal-practice/"><strong>Carnatic Vocal Practice</strong><br>Guided Carnatic singing practice with pitch feedback — privacy policy and support</a>
</main>
</body>
</html>
